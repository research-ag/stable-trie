[package]
name = "stable-trie"
version = "0.0.8"
description = "Stable-memory trie-based key-value map"
repository = "https://github.com/research-ag/stable-trie"
keywords = [ "set", "enumeration", "lookup", "bijective", "key-value" ]
license = "Apache-2.0"

[dependencies]
core = "2.5.0"

[dev-dependencies]
bench-helper = "0.0.3"
prng = "0.0.9"

[requirements]
moc = "1.6.0"

[toolchain]
moc = "1.7.0"
wasmtime = "42.0.1"
